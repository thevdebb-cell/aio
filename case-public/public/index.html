<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Case</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="logo.png" alt="" class="logo" onerror="this.style.display='none';">
    <h1>Public Case</h1>
    <p class="tag-line">Public, declassified case records. Check someone before you let them in your RP.</p>
  </header>

  <main>
    <div id="view-list">
      <input type="text" id="search" placeholder="Search a number, name or subject...">
      <div id="list"></div>
    </div>

    <div id="view-detail" style="display:none;">
      <a class="back" onclick="go('')">&larr; Back</a>
      <div id="detail"></div>
    </div>
  </main>

  <footer>case sorti</footer>

  <script src="app.js"></script>
</body>
</html>
